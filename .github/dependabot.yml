version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep Next.js and its ESLint config moving together (eslint-config-next is pinned to next).
      next:
        patterns:
          - next
          - eslint-config-next
          - "@next/*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
